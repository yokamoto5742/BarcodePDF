[project]
name = "barcodepdf"
version = "1.1.1"
requires-python = ">=3.13"

dependencies = [
    "numpy>=1.24.4",
    "opencv-python-headless>=4.10.0.84",
    "pillow>=10.4.0",
    "pymupdf>=1.24.7",
    "pyzbar>=0.1.9",
    "watchdog>=4.0.1",
]

[dependency-groups]
dev = [
    "coverage>=7.10.1",
    "pyinstaller>=6.14.2",
    "pyright>=1.1.407",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["app", "service", "utils", "tests"]
exclude = ["scripts"]
reportMissingTypeStubs = false
reportUnusedVariable = true
reportUnusedImport = true
